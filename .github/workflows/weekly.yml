name: Weekly carbon report

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Generate report
        run: python carbon_report.py
      - name: Publish latest report
        run: |
          mkdir -p reports/latest
          cp out/weekly_report.md   reports/latest/weekly_report.md
          cp out/carbon_prices.png  reports/latest/carbon_prices.png
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "chore: weekly carbon report $(date -u +%Y-%m-%d) [skip ci]" || echo "no changes to commit"
          git push
